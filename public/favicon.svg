<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Trend arrow (upward line chart) -->
  <polyline
    points="80,380 180,260 260,310 380,140"
    fill="none"
    stroke="url(#icon)"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Arrow head -->
  <polyline
    points="300,120 380,140 360,220"
    fill="none"
    stroke="url(#icon)"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Checkmark dot on the last point -->
  <circle cx="380" cy="140" r="28" fill="white"/>
</svg>
